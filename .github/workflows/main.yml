name: CI

on: [push]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  # Packman
  PM_PACKAGES_ROOT: ${{ github.workspace }}/packman-repo

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Windows - MSVC",
              artifact: "windows-msvc.tar.xz",
              os: windows-2022,
              preset: Windows-Release,
              cc: "cl",
              cxx: "cl",
              build-type: "Release",
              build-code: "Windows",
              cache-type: "Windows",
              coverage: "false",
              visual-studio-version: "2022",
              visual-studio-components: "Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64",
            }
          - {
              name: "Ubuntu - GCC",
              artifact: "linux-gcc.tar.xz",
              os: ubuntu-24.04,
              preset: Linux-Release,
              cc: "gcc-13",
              cxx: "g++-13",
              build-type: "Release",
              build-code: "Ubuntu",
              cache-type: "Linux",
              coverage: "false",
            }
          - {
              name: "Ubuntu 22 - GCC",
              artifact: "linux-gcc.tar.xz",
              os: ubuntu-24.04,
              preset: Linux-Release,
              cc: "gcc-13",
              cxx: "g++-13",
              build-type: "Release",
              build-code: "Ubuntu22",
              cache-type: "Linux",
              coverage: "false",
            }

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          lfs: true
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: SimenB/github-actions-cpu-cores@v1
        id: cpu-cores

      # Tell vcpkg to look for or create its build folder in the repository's root directory
      # This is partly done to make the directory easily accessible to Docker builds
      # We only need a release build of vcpkg dependencies
      - name: vcpkg Set build directory (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir $GITHUB_WORKSPACE/vcpkg-cache
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/vcpkg-cache" >> $GITHUB_ENV
          echo "CESIUM_VCPKG_RELEASE_ONLY=TRUE" >> $GITHUB_ENV

      - name: vcpkg Set build directory (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -Path $env:GITHUB_WORKSPACE\vcpkg-cache -ItemType Directory
          $GITHUB_WORKSPACE/vcpkg-cache
          echo "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\vcpkg-cache" >> $env:GITHUB_ENV
          echo "CESIUM_VCPKG_RELEASE_ONLY=TRUE" >> $env:GITHUB_ENV

      - name: vcpkg Check cache
        id: vcpkg-cache
        uses: actions/cache@v3
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.config.name }}-${{ hashFiles('vcpkg/ports/**/*', 'vcpkg/triplets/**/*', 'vcpkg.json') }}-v1

      - name: Packman Check cache
        id: packman-cache
        uses: actions/cache@v3
        with:
          path: ${{ env.PM_PACKAGES_ROOT }}
          key: packman-${{ matrix.config.cache-type }}-${{ hashFiles('extern/nvidia/deps/kit-sdk.packman.xml', 'extern/nvidia/deps/target-deps.packman.xml') }}-v1

      - name: Ubuntu 22 Build with Docker
        uses: ./.github/actions
        if: matrix.config.name == 'Ubuntu 22 - GCC'
        with:
          preset: ${{ matrix.config.preset }}

      # Change the ownership from root to user for all files created by Docker in
      # the build directory so that the files can be cached without permission
      # denied errors
      - name: Ubuntu 22 Change vcpkg and Packman directory permissions
        if: matrix.config.name == 'Ubuntu 22 - GCC'
        run: |
          sudo chown -R $USER:$USER $PM_PACKAGES_ROOT
          sudo chown -R $USER:$USER $VCPKG_DEFAULT_BINARY_CACHE

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' && matrix.config.name != 'Ubuntu 22 - GCC' }}
        run: |
          sudo apt update
          sudo apt install -y doxygen clang-tidy-15 clang-format-15 gcovr autoconf autoconf-archive automake libtool
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-15 100
          sudo update-alternatives --set clang-format /usr/bin/clang-format-15
          sudo pip3 install black==23.1.0 flake8==7.1.1 pybind11 --ignore-installed
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV #for some reason they define VCPKG_INSTALLATION_ROOT which isn't standard

      # Could not figure out how to add Chocolatey libraries to the PATH automatically with refreshenv, so
      # hardcoding their locations instead. Followed these instructions for adding to the PATH on PowerShell:
      # https://docs.github.com/en/actions/reference/workflow-commands-for-github-actions#environment-files
      # Note that this is only a problem on CI, not with local builds
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install -y llvm --version=15.0.7 --allow-downgrade
          echo "C:/Program Files/LLVM/bin" >> $env:GITHUB_PATH
          pip3 install black==23.1.0 flake8==7.1.1 pybind11
      - name: Install Visual Studio components
        if: ${{ matrix.config.visual-studio-version && matrix.config.visual-studio-components }}
        run: |
          $components = "${{ matrix.config.visual-studio-components }}" -split "," | foreach {"--add $_"}
          if ($components.Length -gt 0)
          {
            $componentcmd = $components -join " "
            Start-Process "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList "modify --installPath ""C:\Program Files\Microsoft Visual Studio\${{ matrix.config.visual-studio-version }}\Enterprise"" --quiet $componentcmd" -Wait -PassThru
          }
      # Note: the presets handle the necessary CMAKE_BUILD_TYPE (Linux) and CMAKE_CONFIGURATION_TYPES (Windows) flags
      - name: Configure
        if: matrix.config.name != 'Ubuntu 22 - GCC'
        run: cmake -B build --preset=${{matrix.config.preset}} -D Python3_EXECUTABLE=python3 -D CESIUM_OMNI_ENABLE_TESTS=OFF -D CESIUM_OMNI_ENABLE_COVERAGE=${{ matrix.config.coverage}} -D CMAKE_C_COMPILER=${{ matrix.config.cc }} -D CMAKE_CXX_COMPILER=${{ matrix.config.cxx }}

      - name: Check C/C++ Formatting
        if: matrix.config.name != 'Ubuntu 22 - GCC'
        run: cmake --build build --target clang-format-check-all --config ${{ matrix.config.build-type }}

      - name: Check Python Formatting
        if: matrix.config.name != 'Ubuntu 22 - GCC'
        run: black --check --diff .

      - name: Check Python Linting
        if: matrix.config.name != 'Ubuntu 22 - GCC'
        run: flake8

      - name: Build
        if: matrix.config.name != 'Ubuntu 22 - GCC'
        run: cmake --build build --config ${{ matrix.config.build-type }} --parallel ${{ steps.cpu-cores.outputs.count }}

      - name: Coverage
        if: matrix.config.coverage == 'true'
        run: cmake --build build --target generate-coverage --config ${{ matrix.config.build-type }}

      - name: Documentation
        # Currently disabled for Windows because `choco install doxygen.install` is flaky
        if: ${{ matrix.config.name != 'Ubuntu 22 - GCC' && runner.os != 'Windows' }}
        run: cmake --build build --target generate-documentation --config ${{ matrix.config.build-type }}

      - name: Install (Default/Kit)
        if: matrix.config.name != 'Ubuntu 22 - GCC'
        run: cmake --install build --config ${{ matrix.config.build-type }}

      - name: Install (Library)
        if: matrix.config.name != 'Ubuntu 22 - GCC'
        run: cmake --install build --config ${{ matrix.config.build-type }} --prefix install-library --component library

      - name: Package
        if: matrix.config.name != 'Ubuntu 22 - GCC'
        run: cmake --build build --target package --config ${{ matrix.config.build-type }}

      - name: Capture Git info (not Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "branch=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "us_date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "zip_name=$(find . -maxdepth 2 -type f -name "CesiumGS-cesium-omniverse*.zip" -exec basename {} \;)" >> $GITHUB_ENV

      - name: Capture Git info (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "branch=${{ github.ref_name }}" >> $env:GITHUB_ENV
          echo "sha_short=$(git rev-parse --short HEAD)" >> $env:GITHUB_ENV
          echo "us_date=$(Get-Date -Format "yyyy-MM-dd")" >> $env:GITHUB_ENV
          echo "zip_name=$(Get-ChildItem -Path build/CesiumGS-cesium-omniverse*.zip -Name)" >> $env:GITHUB_ENV

      - name: Capture AWS secrets
        uses: aws-actions/configure-aws-credentials@v2
        env:
          AWS_S3_USERNAME: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_S3_PASSWORD: ${{ secrets.AWS_SECRET_KEY_ID }}
        with:
          aws-access-key-id: ${{ env.AWS_S3_USERNAME }}
          aws-secret-access-key: ${{ env.AWS_S3_PASSWORD }}
          aws-region: us-east-1

      - name: Upload to S3
        if: ${{ matrix.config.name == 'Ubuntu 22 - GCC' || runner.os == 'Windows' }}
        run: |
          aws s3 cp build/${{ env.zip_name }} s3://cesium-builds/cesium-omniverse/${{ env.branch }}/${{ env.us_date }}/${{ env.sha_short }}/${{ matrix.config.build-code }}/
